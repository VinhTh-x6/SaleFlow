data:
  input_dir: "./data/raw"
  language: "both"

memory:
  max_turns: 3            # So luot hoi thoai giu lai trong phien
  ttl_seconds: 3600       # Thoi gian het han phien sau 1 gio khong hoat dong
  answer_max_chars: 300   # Gioi han ky tu cau tra loi khi tao context lich su

indexing:
  loader:
    pdf_strategy: "docling"
    extract_tables: true
    extract_images: false
    marker_device: "cpu"

  chunking:
    strategy: "semantic"                  # "format_aware" | "semantic"
    chunk_size: 1000
    chunk_overlap: 150
    format_type: "auto"
    semantic_embedding_model: "text-embedding-3-small"
    semantic_breakpoint_type: "percentile"
    semantic_breakpoint_threshold: 95.0

  embedding:
    provider: "openai"
    model_name: "text-embedding-3-small"
    dimensions: null
    enable_sparse: true                   # BM25 sparse vector cho hybrid search

  vector_db:
    provider: "chroma"
    collection_name: "rag_collection"
    persist_dir: "./storage"
    search_score_threshold: 0.2

query_pipeline:
  pre_retrieval:
    transformations: ["none"]             # ["rewrite"] hoac ["none"]
    transformation_llm: "gpt-4.1-mini"

  retrieval:
    strategy: "hybrid"                    # "hybrid" | "dense"
    top_k: 6
    fusion_method: "rrf"
    rrf_k: 60

  post_retrieval:
    reranker: "none"                      # "cross_encoder" | "none"
    cross_encoder_model: "BAAI/bge-reranker-v2-m3"
    top_n: 5
    apply_redundancy: true
    redundancy_threshold: 0.92
    context_ordering: "sandwich"

  prompt:
    template: "safe_rag"
    max_context_chars: 0

  generation:
    provider: "openai"
    model_name: "gpt-4.1-mini"
    temperature: 0.0
    max_tokens: 1200
    streaming: true
